# Lokale infrastructuur: Neo4j (kennisgraaf) + Ollama (gratis lokale modellen, CPU).
# Start:   docker compose up -d
# Modellen: docker compose exec ollama ollama pull qwen2.5:3b
#           docker compose exec ollama ollama pull bge-m3
services:
  neo4j:
    image: neo4j:5-community
    container_name: epd-neo4j
    ports:
      - "7474:7474"   # browser: http://localhost:7474
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/epdexpert123
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: epd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  neo4j_data:
  ollama_models:
